name: Deploy
on:
  push:
    branches:
      - main
    paths-ignore:
      - "dist/**"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and publish to dist/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Download deps
        run: pnpm install --frozen-lockfile

      # build:static stages the crowdfunding section and /api out of the tree
      # first — they need a Node runtime and cannot be exported — then adds
      # deploy/.htaccess, verifies the output, and moves it into dist/.
      - name: Build static export into dist/
        env:
          NEXT_PUBLIC_SITE_URL: https://arek.its.ac.id/rival
          NEXT_PUBLIC_BASE_PATH: /rival
        run: pnpm build:static

      - name: 🔍 Verify the export looks deployable
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/.htaccess  || { echo "::error::dist/.htaccess missing";  exit 1; }
          echo "Exported $(find dist -name '*.html' | wc -l) HTML files, $(du -sh dist | cut -f1) total"

      - name: 💾 Commit dist/ to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist
          if git diff --staged --quiet; then
            echo "Build output identical to the last deploy; nothing to commit."
            exit 0
          fi
          git commit -m "deploy: build ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:main
